<title>病棟勤務表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: 上に病棟の切替と対象月の帯、その下のタブで「勤務表／希望・指定／スタッフ／病棟プロファイル」を切り替える。勤務表は職員×日付の格子を横スクロールで見る */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eef2f1; --ink:#1a2928; --muted:#5a6b69; --line:#d5dddb; --line-strong:#aebcb9;
  --accent:#0d6570; --accent-ink:#ffffff; --accent-soft:#d9eeee;
  --day:#fbe6b4; --day-ink:#5e4100; --night:#2e3d7c; --night-ink:#ffffff; --ake:#e2e0f1; --ake-ink:#46416e;
  --sun:#b3413a; --sat:#2d5ca6; --warn:#a46200; --warn-soft:#fff0d3; --bad:#b0261e; --bad-soft:#fce3df; --ok:#2b7a4c; --ok-soft:#ddf1e5;
  --care:#6a4c93; --care-soft:#efe8f7;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --font-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --radius:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111918; --surface:#192322; --surface-2:#1f2b2a; --ink:#e2eae8; --muted:#98a9a6; --line:#2b3938; --line-strong:#41524f;
  --accent:#5ab8bf; --accent-ink:#06282b; --accent-soft:#163a3d;
  --day:#55420f; --day-ink:#ffe3a3; --night:#4053a8; --night-ink:#ffffff; --ake:#33304c; --ake-ink:#d4cff4;
  --sun:#ef8b81; --sat:#8fb4f2; --warn:#f0b24c; --warn-soft:#3a2b0e; --bad:#f28b82; --bad-soft:#3d1915; --ok:#72cf98; --ok-soft:#12301f;
  --care:#c6a8ee; --care-soft:#2c2340;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111918; --surface:#192322; --surface-2:#1f2b2a; --ink:#e2eae8; --muted:#98a9a6; --line:#2b3938; --line-strong:#41524f;
  --accent:#5ab8bf; --accent-ink:#06282b; --accent-soft:#163a3d;
  --day:#55420f; --day-ink:#ffe3a3; --night:#4053a8; --night-ink:#ffffff; --ake:#33304c; --ake-ink:#d4cff4;
  --sun:#ef8b81; --sat:#8fb4f2; --warn:#f0b24c; --warn-soft:#3a2b0e; --bad:#f28b82; --bad-soft:#3d1915; --ok:#72cf98; --ok-soft:#12301f;
  --care:#c6a8ee; --care-soft:#2c2340;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.65}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.35}
h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1280px;margin:0 auto}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:7px;flex:none;background:
  linear-gradient(var(--accent),var(--accent)) 0 0/100% 34% no-repeat,
  repeating-linear-gradient(90deg,var(--accent-soft) 0 7px,var(--surface) 7px 9px) 0 100%/100% 62% no-repeat;border:1px solid var(--line-strong)}
.brand h1{font-size:1.15rem}
.brand .sub{font-size:.78rem;color:var(--muted)}
.pickers{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.month-pick{display:flex;align-items:center;gap:6px}
.pickers input,.pickers select{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:5px 8px;font-variant-numeric:tabular-nums}
.pickers select{font-weight:700}
.icon-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;width:34px;height:34px;cursor:pointer;font-size:1.1rem;line-height:1}
.icon-btn:hover{background:var(--surface-2)}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:700}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .role{font-size:.7rem;font-weight:400;margin-left:4px;color:var(--muted)}

main.band .inner{padding-block:20px 90px;display:flex;flex-direction:column;gap:16px}
.banner{background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.banner .inner{padding-block:8px;font-size:.85rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:6px}

.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:.82rem}
.btn.tiny{padding:1px 8px;font-size:.78rem;font-weight:400}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{appearance:none;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;font-weight:700}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700;border:1px solid var(--line-strong);background:var(--surface-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.care{background:var(--care-soft);color:var(--care);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter span{display:block;height:100%;background:var(--accent);transition:width .2s}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:700}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 8px;color:var(--ink);min-width:0}
input[type=number]{width:5.5em;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:72px;resize:vertical}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.hint{font-size:.8rem;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0;min-width:0}
legend{font-size:.82rem;font-weight:700;color:var(--muted);padding:0 4px}

.gen-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
@media (max-width:720px){.gen-grid{grid-template-columns:1fr}}
.gen-form{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.confirm{background:var(--warn-soft);border-radius:6px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.precheck{background:var(--bad-soft);border-radius:6px;padding:10px 12px;font-size:.86rem}
.precheck ul{margin:4px 0 0;padding-left:1.2em}

.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);align-items:center}
.legend .c{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;width:26px;height:22px;border-radius:4px;font-weight:700;margin-right:4px;font-size:.78rem}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.roster{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:.82rem}
.roster th,.roster td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center}
.roster thead th{position:sticky;top:0;background:var(--surface);z-index:2}
.roster .name-col{position:sticky;left:0;background:var(--surface);z-index:3;text-align:left;min-width:140px;max-width:160px;padding:4px 8px;border-right:1px solid var(--line-strong)}
.roster thead .name-col{z-index:4}
.roster .day-h{width:34px;min-width:34px;padding:4px 0;line-height:1.2}
.roster .day-h .dn{display:block;font-weight:700}
.roster .day-h .dw{display:block;font-size:.7rem;color:var(--muted)}
.roster .sun .dn,.roster .sun .dw{color:var(--sun)}
.roster .sat .dn,.roster .sat .dw{color:var(--sat)}
.roster .day-h .hol{display:block;font-size:.62rem;color:var(--sun)}
.roster td.cell{height:30px;position:relative;font-weight:700}
.roster td.cell button,.roster td.cell>span{all:unset;display:flex;align-items:center;justify-content:center;white-space:nowrap;width:100%;height:30px;cursor:pointer}
.roster td.cell>span{cursor:default}
.roster td.cell button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.c-D{background:var(--day);color:var(--day-ink)}
.c-N{background:var(--night);color:var(--night-ink)}
.c-A{background:var(--ake);color:var(--ake-ink)}
.c-X{color:var(--muted);font-weight:400}
.cell sup{font-size:.6rem;margin-left:1px;font-weight:700}
.cell.mk-x::after,.cell.mk-tri::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 8px 8px 0}
.cell.mk-x::after{border-color:transparent var(--bad) transparent transparent}
.cell.mk-tri::after{border-color:transparent var(--warn) transparent transparent}
.cell.fixed::before{content:"";position:absolute;left:3px;bottom:3px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75}
.cell.hit-tri{box-shadow:inset 0 0 0 2px var(--warn)}
.cell.hit-x{box-shadow:inset 0 0 0 2px var(--bad)}
.roster .nm{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster .meta{display:block;font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster .stat{min-width:34px;padding:0 4px;color:var(--ink)}
.roster .stat.dev{color:var(--bad);font-weight:700;background:var(--bad-soft)}
.roster .stat.soft{color:var(--warn);font-weight:700}
.roster tr.group th{background:var(--care-soft);color:var(--care);text-align:left;padding:3px 8px;font-size:.78rem}
.roster tr.group td{background:var(--care-soft)}
.roster tfoot th,.roster tfoot td{background:var(--surface-2);height:28px}
.roster tfoot .name-col{background:var(--surface-2);font-size:.76rem}
.roster td.short{color:var(--bad);font-weight:700;background:var(--bad-soft)}
.roster td.over{color:var(--warn)}
.roster td small{font-size:.65rem;color:var(--muted);font-weight:400}

.issues{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.issues li{display:flex;gap:8px;align-items:baseline;font-size:.86rem;padding:4px 0;border-bottom:1px dashed var(--line)}
.issues .lv{flex:none}

.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);padding:8px 11px;cursor:pointer;font-weight:700;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wh{text-align:center;font-size:.78rem;font-weight:700;color:var(--muted);padding:2px 0}
.cal .wh.sun{color:var(--sun)} .cal .wh.sat{color:var(--sat)}
.cal .dc{border:1px solid var(--line);border-radius:6px;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.cal .dc.blank{border:0;background:none}
.cal .dc.is-off{border-color:var(--bad);background:var(--bad-soft)}
.cal .dc.is-fixD{border-color:var(--day-ink);background:var(--day)}
.cal .dc.is-fixN{border-color:var(--night);box-shadow:inset 0 0 0 1px var(--night)}
.cal .dbtn{appearance:none;border:0;background:none;cursor:pointer;font-weight:700;padding:3px 2px 0;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.cal .dbtn .tag{font-size:.66rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1.1em}
.cal .is-off .tag{color:var(--bad)} .cal .is-fixD .tag{color:var(--day-ink)} .cal .is-fixN .tag{color:var(--night)}
.cal .dc.sun .dbtn>span:first-child{color:var(--sun)} .cal .dc.sat .dbtn>span:first-child{color:var(--sat)}
.cal .slot{appearance:none;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;padding:3px 2px;font-size:.74rem;display:flex;justify-content:center;gap:3px;align-items:center;min-height:26px}
.cal .slot .st{font-weight:700;min-width:1em}
.cal .slot.s2{background:var(--bad-soft);color:var(--bad)}
.cal .slot.s1{background:var(--warn-soft);color:var(--warn)}
.cal .weekly{font-size:.62rem;color:var(--muted);text-align:center;line-height:1.2}
@media (max-width:480px){.cal .slot .lb{display:none}.cal .slot{font-size:.8rem}.cal .dbtn .tag{font-size:.6rem}}

.tbl-wrap{overflow-x:auto}
table.list{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
.list th,.list td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.list th{font-size:.76rem;color:var(--muted);letter-spacing:.04em}
.list td.num{text-align:right}
.list .ord{display:flex;gap:2px}
.list .ord button{width:26px;height:24px;padding:0;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;cursor:pointer}
.list .ord button:disabled{opacity:.3;cursor:default}
.list tr.sel td{background:var(--accent-soft)}
.editor{border:1px solid var(--accent);background:var(--surface);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.weekly-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.weekly-grid label{display:flex;flex-direction:column;gap:2px;font-size:.76rem;font-weight:700;color:var(--muted);text-align:center}
.weekly-grid select{padding:4px 2px;font-size:.78rem}
@media (max-width:560px){.weekly-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
table.staffing{border-collapse:collapse;font-variant-numeric:tabular-nums}
.staffing th,.staffing td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:center}
.staffing th.rl{text-align:left;font-size:.82rem;white-space:nowrap}
.staffing tr.care-row th.rl{color:var(--care)}
.staffing input[type=number]{width:3.4em;text-align:center}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line-strong);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.savebar .inner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.empty p{max-width:56ch}

.popover{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:4px;min-width:180px}
.popover .ph{font-size:.78rem;color:var(--muted);padding:2px 4px 4px}
.popover button{appearance:none;border:0;background:none;text-align:left;padding:6px 8px;border-radius:5px;cursor:pointer;display:flex;gap:8px;align-items:center}
.popover button:hover{background:var(--surface-2)}
.popover .c{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;width:28px;height:22px;border-radius:4px;font-weight:700;font-size:.78rem}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;max-width:min(92vw,560px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="band"><div class="inner">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>
      <div><h1 id="wardTitle">病棟勤務表</h1><p class="sub" id="modeLine">読み込み中…</p></div></div>
    <div class="pickers">
      <label for="wardSel" class="sr">病棟</label>
      <select id="wardSel" hidden></select>
      <div class="month-pick">
        <button class="icon-btn" data-action="month-prev" aria-label="前の月">‹</button>
        <label for="monthInput" class="sr">対象月</label>
        <input type="month" id="monthInput">
        <button class="icon-btn" data-action="month-next" aria-label="次の月">›</button>
      </div>
    </div>
  </div></div>
  <div class="band"><div class="inner"><nav class="tabs" id="tabs" role="tablist"></nav></div></div>
</header>
<div id="banner"></div>
<main class="band"><div class="inner" id="main">
  <div class="empty"><h2>読み込み中…</h2><p class="muted">病棟プロファイル、スタッフ、希望、勤務表を読み込んでいます。</p></div>
</div></main>
<div id="savebarHost"></div>
<div id="popover" class="popover" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const num=(v,def=0)=>{const x=Number(v);return v!==""&&v!=null&&Number.isFinite(x)?x:def;};
const clone=o=>JSON.parse(JSON.stringify(o));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const WD=["日","月","火","水","木","金","土"];
const WD_ORDER=[1,2,3,4,5,6,0];
const ROLES={nurse:"看護師",care:"ケアワーカー"};
const TYPES={dayOnly:"日勤のみ",normal:"日勤・夜勤",nightMain:"夜勤中心",nightOnly:"夜勤専従"};
const WEEKLY={"":"指定なし",off:"休み",day:"日勤",noNight:"夜勤不可",noDay:"日勤不可"};
const CH=["X","D","N","A"],CODE={X:0,D:1,N:2,A:3},LABEL=["休","日","夜","明"];
const HOLIDAYS=new Set(["2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29","2026-05-03","2026-05-04","2026-05-05","2026-05-06","2026-07-20","2026-08-11","2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23",
 "2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22","2027-04-29","2027-05-03","2027-05-04","2027-05-05","2027-07-19","2027-08-11","2027-09-20","2027-09-23","2027-10-11","2027-11-03","2027-11-23",
 "2028-01-01","2028-01-10","2028-02-11","2028-02-23","2028-03-20","2028-04-29","2028-05-03","2028-05-04","2028-05-05","2028-07-17","2028-08-11","2028-09-18","2028-09-22","2028-10-09","2028-11-03","2028-11-23"]);
const PD={ // 病棟プロファイルの既定値（staffing の配列の添字は曜日、0=日）
  name:"",order:0,
  staffing:{nurse:[{D:6,N:3},{D:9,N:3},{D:9,N:3},{D:9,N:3},{D:9,N:3},{D:9,N:3},{D:7,N:3}],
            care:[{D:0,N:0},{D:0,N:0},{D:0,N:0},{D:0,N:0},{D:0,N:0},{D:0,N:0},{D:0,N:0}]},
  leaderDays:[false,true,true,true,true,true,true],
  holidayAsSunday:false,nightLeader:false,
  preceptor:{enabled:true,minExp:3,mode:"any",newNoNight:false,countNew:true},
  ngPairs:[],offDays:9,maxConsec:5,akeOff:"required",nightGap:4,nightHalf:true,
  maxNights:{normal:5,nightMain:8,nightOnly:10},
  doubleOff:2,holidayOffMin:2,deadlineDay:20,requestMode:"form",memo:""
};
const LKEY="ward-roster-local-v2";

/* ---------- 保存先 ---------- */
const Store={db:null,data:{},ls:{},
  initLocal(){let raw=null;try{raw=localStorage.getItem(LKEY);}catch(e){}try{this.data=raw?JSON.parse(raw):{};}catch(e){this.data={};}},
  persist(){try{localStorage.setItem(LKEY,JSON.stringify(this.data));}catch(e){}},
  list(col){const c=this.data[col]||{};return Object.keys(c).sort().map(id=>({...clone(c[id]),_id:id}));},
  emit(col){const l=this.list(col);(this.ls[col]||[]).forEach(f=>f(l));},
  sub(col,cb){
    if(this.db)return this.db.collection(col).onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),_id:d.id}))),e=>{if(e&&e.code!=="revoked")toast("データの受信が止まりました。ページを開き直してください。");});
    (this.ls[col]||(this.ls[col]=[])).push(cb);cb(this.list(col));return()=>{};},
  async set(path,data){const d={...data};delete d._id;if(this.db)return this.db.doc(path).set(d);const[c,id]=path.split("/");(this.data[c]||(this.data[c]={}))[id]=clone(d);this.persist();this.emit(c);},
  async del(path){if(this.db)return this.db.doc(path).delete();const[c,id]=path.split("/");if(this.data[c])delete this.data[c][id];this.persist();this.emit(c);}
};
function writeError(e){
  const code=e&&e.code;
  if(code==="invalid_argument")toast("保存できませんでした。この画面で変更する権限がない可能性があります。");
  else if(code==="quota_exceeded")toast("保存容量の上限に達しました。古いデータを削除してください。");
  else toast("保存できませんでした。通信状況を確認して、もう一度お試しください。");}

/* ---------- 状態 ---------- */
const S={mode:"loading",isAdmin:false,uid:null,
  wards:[],staff:[],requests:{},schedules:{},override:{},
  wardId:null,month:defaultMonth(),tab:"schedule",
  reqSel:null,reqMode:"off",reqLabel:"",reqDraft:null,
  rulesDraft:null,rulesDirty:false,ngA:"",ngB:"",
  staffEdit:null,staffDel:null,wardDel:null,wardRename:null,
  offDraft:{},confirmGen:false,gen:false,genP:0,pop:null};

function defaultMonth(){const t=new Date();const d=new Date(t.getFullYear(),t.getMonth()+1,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;}
function addMonth(m,k){const[y,mo]=m.split("-").map(Number);const d=new Date(y,mo-1+k,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;}
function monthLabel(m){const[y,mo]=m.split("-");return `${y}年${Number(mo)}月`;}
function monthInfo(m){const[y,mo]=m.split("-").map(Number);const L=new Date(y,mo,0).getDate();const days=[];
  for(let d=1;d<=L;d++){const wd=new Date(y,mo-1,d).getDay();const key=`${y}-${pad(mo)}-${pad(d)}`;days.push({d,wd,key,hol:HOLIDAYS.has(key)});}
  return{y,mo,L,days};}
const holidayOp=(day,p)=>day.wd===0||(p.holidayAsSunday&&day.hol);
const wdKey=(day,p)=>holidayOp(day,p)?0:day.wd;

function mergeProfile(doc){
  const s=clone(PD);if(!doc)return s;
  for(const k of Object.keys(PD)){if(doc[k]===undefined||k==="staffing")continue;
    const dv=PD[k];
    if(Array.isArray(dv))s[k]=clone(doc[k]);
    else if(dv&&typeof dv==="object")s[k]={...dv,...doc[k]};
    else s[k]=doc[k];}
  for(const r of ["nurse","care"])s.staffing[r]=PD.staffing[r].map((x,i)=>({D:num(doc.staffing?.[r]?.[i]?.D,x.D),N:num(doc.staffing?.[r]?.[i]?.N,x.N)}));
  s.leaderDays=PD.leaderDays.map((x,i)=>typeof s.leaderDays?.[i]==="boolean"?s.leaderDays[i]:x);
  s.ngPairs=(s.ngPairs||[]).filter(p=>p&&p.a&&p.b);
  if(!["required","preferred","none"].includes(s.akeOff))s.akeOff="required";
  return s;}

const wardDoc=wid=>S.wards.find(w=>w._id===wid)||null;
const prof=()=>mergeProfile(wardDoc(S.wardId));
const wardName=wid=>wardDoc(wid)?.name||"（名称未設定）";
function staffOf(wid){
  const list=S.staff.filter(x=>x.wardId===wid);
  const ord=x=>x.order==null||x.order===""?1e6-num(x.exp)*100:num(x.order);
  const by=(a,b)=>ord(a)-ord(b)||num(b.exp)-num(a.exp)||String(a.name).localeCompare(String(b.name),"ja");
  return[...list.filter(x=>(x.role||"nurse")==="nurse").sort(by),...list.filter(x=>x.role==="care").sort(by)];}
const staffById=id=>S.staff.find(x=>x._id===id);
const shortName=x=>String(x?.name||"").replace(/^例）/,"");
const schedKey=(wid,m)=>wid+"_"+m;
const schedOf=(wid,m)=>S.override[schedKey(wid,m)]||S.schedules[schedKey(wid,m)]||null;
function requestFor(sid,m){let best=null;
  for(const doc of Object.values(S.requests)){if((doc.staffId||doc.nurseId)!==sid)continue;const r=doc.months&&doc.months[m];
    if(r&&(!best||(r.updatedAt||0)>(best.updatedAt||0)))best=r;}
  return best;}
const myReqDocId=sid=>S.isAdmin?"mgr-"+sid:S.uid;
function nightCap(x,p){if((x.nightType||"normal")==="dayOnly")return 0;if(x.maxNights!==""&&x.maxNights!=null)return num(x.maxNights,0);return num(p.maxNights[x.nightType||"normal"],5);}
// 毎週の条件と、その月の希望・指定を一日ずつ合わせたもの
function dayReq(x,r,dy){
  const w=(x.weekly||{})[dy.wd]||"",base=w==="off"?{off:1,weekly:1}:w==="day"?{fix:"D",label:"毎週",weekly:1}:w==="noNight"?{N:2,weekly:1}:w==="noDay"?{D:2,weekly:1}:{};
  const c=r?.days?.[dy.d];return c&&Object.keys(c).length?c:base;}

/* ---------- 自動作成のモデル ---------- */
const W={short:1000,overD:15,overN:400,leader:900,precept:700,ng:1000,avoid:60,off:120,off2:30,
  nightOver:2000,nightUnder:160,nightBal:12,consec:400,akeSoft:300,dbl:600,hol:700,gap:120,half:150};

function buildModel(wid,m,offTarget){
  const p=mergeProfile(wardDoc(wid)),mi=monthInfo(m),L=mi.L,staff=staffOf(wid),n=staff.length,pc=p.preceptor;
  const idx=new Map(staff.map((x,i)=>[x._id,i]));
  const M={wid,m,mi,L,n,staff,idx,p,offTarget,maxConsec:num(p.maxConsec,5),akeReq:p.akeOff==="required",akePref:p.akeOff==="preferred",
    nightLeader:!!p.nightLeader,precOn:!!pc.enabled,precMode:pc.mode,nightGap:num(p.nightGap,0),nightHalf:!!p.nightHalf,half:Math.ceil(L/2),conflicts:[]};
  M.role=staff.map(x=>x.role==="care"?1:0);
  M.isNew=staff.map((x,i)=>!M.role[i]&&!!x.isNew);
  M.newList=staff.map((x,i)=>i).filter(i=>M.isNew[i]);
  M.cnt=staff.map((x,i)=>x.excludeFromCount||(M.isNew[i]&&!pc.countNew)?0:1);
  M.qualP=staff.map((x,i)=>!M.role[i]&&!x.isNew&&num(x.exp)>=num(pc.minExp,3));
  M.prec=staff.map(x=>x.preceptorId&&idx.has(x.preceptorId)?idx.get(x.preceptorId):-1);
  M.leader=staff.map((x,i)=>!M.role[i]&&!!x.leader&&!x.isNew);
  M.type=staff.map(x=>x.nightType||"normal");
  M.maxN=staff.map(x=>nightCap(x,p));
  M.onlyFix=staff.map(x=>!!x.onlyDesignatedNights);
  M.dblWant=staff.map(x=>x.doubleOff!==""&&x.doubleOff!=null?num(x.doubleOff,0):num(p.doubleOff,0));
  M.reqD=[0,1].map(r=>mi.days.map(d=>p.staffing[r?"care":"nurse"][wdKey(d,p)].D));
  M.reqN=[0,1].map(r=>mi.days.map(d=>p.staffing[r?"care":"nurse"][wdKey(d,p)].N));
  M.leadReq=mi.days.map(d=>!!p.leaderDays[wdKey(d,p)]);
  M.holDay=mi.days.map(d=>d.wd===0||d.hol?1:0);
  M.holMin=Math.min(num(p.holidayOffMin,0),M.holDay.reduce((a,b)=>a+b,0));
  const sz=n*L;
  ["off","unD","unN","avD","avN","canD","canN","fix","locked"].forEach(k=>M[k]=new Uint8Array(sz));
  M.g0=new Uint8Array(sz);M.label=new Array(sz).fill("");M.note=staff.map(()=>"");
  staff.forEach((x,i)=>{const r=requestFor(x._id,m);M.note[i]=r?.note||"";
    mi.days.forEach((dy,d)=>{const c=dayReq(x,r,dy),k=i*L+d;
      M.off[k]=c.off?1:0;M.unD[k]=c.D===2?1:0;M.unN[k]=c.N===2?1:0;M.avD[k]=c.D===1?1:0;M.avN[k]=c.N===1?1:0;
      M.fix[k]=c.fix==="D"?1:c.fix==="N"?2:0;M.label[k]=c.label||"";});});
  const dl=d=>`${d+1}日`;
  const lockCell=(k,v)=>{if(M.locked[k]&&M.g0[k]!==v)return false;M.g0[k]=v;M.locked[k]=1;return true;};
  // 前月からの持ち越し
  const prev=schedOf(wid,addMonth(m,-1));
  M.carryRun=new Int16Array(n);M.prevAke=new Uint8Array(n);M.lastNight=new Int16Array(n).fill(-99);
  staff.forEach((x,i)=>{const r=prev?.rows?.[x._id];if(!r)return;const Lp=r.length,b=i*L,last=r[Lp-1];
    let run=0;for(let j=Lp-1;j>=0&&r[j]!=="X";j--)run++;M.carryRun[i]=run;
    const ln=r.lastIndexOf("N");if(ln>=0)M.lastNight[i]=ln-Lp;
    if(last==="N"){lockCell(b,3);if(M.akeReq&&L>1)lockCell(b+1,0);}
    if(last==="A"){M.prevAke[i]=1;if(M.akeReq)lockCell(b,0);}
    if(Lp>1&&r[Lp-2]==="N"&&last==="A"&&M.akeReq)lockCell(b,0);});
  // 休み希望 → 夜勤指定 → 日勤指定 の順に固定する
  staff.forEach((x,i)=>{for(let d=0;d<L;d++){const k=i*L+d;if(M.off[k]&&!lockCell(k,0))M.conflicts.push(`${x.name} ${dl(d)}：休み希望が前月からの夜勤明けと重なっています`);}});
  staff.forEach((x,i)=>{for(let d=0;d<L;d++){const k=i*L+d;if(M.fix[k]!==2)continue;
    const okA=d+1>=L||(!M.locked[k+1]||M.g0[k+1]===3),okX=!M.akeReq||d+2>=L||!M.locked[k+2]||M.g0[k+2]===0;
    if(M.locked[k]&&M.g0[k]!==2||!okA||!okX){M.conflicts.push(`${x.name} ${dl(d)}：夜勤指定が翌日・翌々日の休み希望や他の指定と重なるため反映できません`);continue;}
    lockCell(k,2);if(d+1<L)lockCell(k+1,3);if(M.akeReq&&d+2<L)lockCell(k+2,0);}});
  staff.forEach((x,i)=>{for(let d=0;d<L;d++){const k=i*L+d;if(M.fix[k]!==1)continue;
    if(!lockCell(k,1))M.conflicts.push(`${x.name} ${dl(d)}：日勤指定が夜勤明け・明けの翌日の休みと重なるため反映できません`);}});
  staff.forEach((x,i)=>{for(let d=0;d<L;d++){const k=i*L+d;
    M.canD[k]=(!M.off[k]&&!M.unD[k]&&M.type[i]!=="nightOnly")?1:0;
    M.canN[k]=(!M.off[k]&&!M.unN[k]&&M.type[i]!=="dayOnly"&&M.maxN[i]>0&&!M.onlyFix[i]&&!(M.isNew[i]&&M.precOn&&pc.newNoNight)&&(d===L-1||!M.off[k+1]))?1:0;}});
  M.ng=p.ngPairs.map(q=>[idx.get(q.a),idx.get(q.b)]).filter(q=>q[0]!=null&&q[1]!=null);
  return M;}

function dayCost(M,g,d){
  const n=M.n,L=M.L,cD=[0,0],cN=[0,0];let ldD=false,ldN=false,c=0;
  for(let i=0;i<n;i++){const k=i*L+d,v=g[k];if(!v)continue;const r=M.role[i];
    if(v===1){cD[r]+=M.cnt[i];if(M.leader[i])ldD=true;if(M.avD[k])c+=W.avoid;}
    else if(v===2){cN[r]+=M.cnt[i];if(M.leader[i])ldN=true;if(M.avN[k])c+=W.avoid;}
    else if(M.avD[k])c+=W.avoid/2;}
  for(let r=0;r<2;r++){const sD=M.reqD[r][d]-cD[r];c+=sD>0?sD*W.short:sD*sD*W.overD;const sN=M.reqN[r][d]-cN[r];c+=sN>0?sN*W.short:(-sN)*W.overN;}
  if(M.leadReq[d]&&!ldD)c+=W.leader;
  if(M.nightLeader&&M.reqN[0][d]>0&&!ldN)c+=W.leader;
  if(M.precOn)for(const i of M.newList){const v=g[i*L+d];if(v!==1&&v!==2)continue;let ok=false;
    if(M.precMode==="assigned"&&M.prec[i]>=0)ok=g[M.prec[i]*L+d]===v;
    else for(let j=0;j<n;j++){if(M.qualP[j]&&g[j*L+d]===v){ok=true;break;}}
    if(!ok)c+=W.precept;}
  for(const q of M.ng){const va=g[q[0]*L+d];if((va===1||va===2)&&va===g[q[1]*L+d])c+=W.ng;}
  return c;}

function nurseCost(M,g,i){
  const L=M.L,b=i*L;let off=0,nights=0,run=M.carryRun[i],c=0,pairs=0,prevX=false,paired=false,hol=0,last=M.lastNight[i],h1=0,h2=0;
  for(let d=0;d<L;d++){const v=g[b+d];
    if(v===0){off++;run=0;if(M.holDay[d])hol++;if(prevX&&!paired){pairs++;paired=true;}else paired=false;prevX=true;}
    else{run++;if(run>M.maxConsec)c+=W.consec;prevX=false;paired=false;}
    if(v===2){nights++;if(d<M.half)h1++;else h2++;if(d-last<M.nightGap&&!M.onlyFix[i])c+=W.gap;last=d;}
    if(M.akePref){const pv=d===0?(M.prevAke[i]?3:0):g[b+d-1];if(pv===3&&(v===1||v===2))c+=W.akeSoft;}}
  if(pairs<M.dblWant[i])c+=(M.dblWant[i]-pairs)*W.dbl;
  if(hol<M.holMin)c+=(M.holMin-hol)*W.hol;
  if(M.type[i]!=="nightOnly"){const dev=Math.abs(off-M.offTarget);c+=dev*W.off+dev*dev*W.off2;}
  const mx=M.maxN[i];
  if(nights>mx)c+=(nights-mx)*W.nightOver;
  if(M.type[i]==="nightMain"||M.type[i]==="nightOnly"){if(!M.onlyFix[i])c+=Math.max(0,mx-nights)*W.nightUnder;}
  else c+=nights*nights*W.nightBal;
  if(M.nightHalf&&!M.onlyFix[i]){const dv=Math.abs(h1-h2);if(dv>1)c+=(dv-1)*W.half;}
  return c;}

async function annealOnce(M,onProgress,p0,p1){
  const{n,L}=M,g=M.g0.slice(),locked=M.locked,nc=new Int16Array(n);
  for(let i=0;i<n;i++)for(let d=0;d<L;d++)if(g[i*L+d]===2)nc[i]++;
  const dayC=new Float64Array(L),nurC=new Float64Array(n);let total=0;
  for(let d=0;d<L;d++){dayC[d]=dayCost(M,g,d);total+=dayC[d];}
  for(let i=0;i<n;i++){nurC[i]=nurseCost(M,g,i);total+=nurC[i];}
  let best=total;const bestG=g.slice();
  const iters=Math.min(2500000,Math.max(500000,n*L*1500)),T0=400,T1=0.3,CHUNK=20000;
  const ch=[],ds=[],ns=[],nd=[],nn=[];
  const setC=(k,v)=>{const o=g[k],i=(k/L)|0;ch.push(k,o);if(o===2)nc[i]--;if(v===2)nc[i]++;g[k]=v;};
  const revert=()=>{for(let q=ch.length-2;q>=0;q-=2){const k=ch[q],o=ch[q+1],i=(k/L)|0;if(g[k]===2)nc[i]--;if(o===2)nc[i]++;g[k]=o;}ch.length=0;};
  const rnd=x=>(Math.random()*x)|0;
  const dayOK=(i,d)=>{const k=i*L+d;return!locked[k]&&M.canD[k]&&!(M.akeReq&&d>0&&g[k-1]===3);};
  const placeN=(i,d)=>{const k=i*L+d;
    if(locked[k]||g[k]>1||!M.canN[k]||nc[i]>=M.maxN[i])return false;
    if(d>0&&(g[k-1]===2||(M.akeReq&&g[k-1]===3)))return false;
    if(d+1<L&&(locked[k+1]||g[k+1]>1))return false;
    if(M.akeReq&&d+2<L){const v=g[k+2];if(v>=2||(v===1&&locked[k+2]))return false;}
    setC(k,2);if(d+1<L)setC(k+1,3);if(M.akeReq&&d+2<L&&g[k+2]===1)setC(k+2,0);return true;};
  const canRem=(i,d)=>{const k=i*L+d;return g[k]===2&&!locked[k];};
  const remN=(i,d)=>{const k=i*L+d;setC(k,0);if(d+1<L&&g[k+1]===3&&!locked[k+1])setC(k+1,0);};
  for(let it=0;it<iters;it++){
    if(it%CHUNK===0){onProgress(p0+(p1-p0)*it/iters);await new Promise(r=>setTimeout(r,0));}
    const T=T0*Math.pow(T1/T0,it/iters);
    ch.length=0;
    const r=Math.random(),i=rnd(n),d=rnd(L),k=i*L+d;
    if(r<0.28){ // 日勤⇔休み
      if(g[k]===0){if(!dayOK(i,d))continue;setC(k,1);}else if(g[k]===1&&!locked[k])setC(k,0);else continue;
    }else if(r<0.40){if(!placeN(i,d))continue; // 夜勤セットを入れる
    }else if(r<0.47){if(!canRem(i,d))continue;remN(i,d); // 夜勤セットを外す
    }else if(r<0.67){ // 同じ日の二人を入れ替える
      const j=rnd(n);if(j===i)continue;const kj=j*L+d,a=g[k],b=g[kj];
      if(a===b||a>1||b>1||locked[k]||locked[kj])continue;
      if(a===1&&!dayOK(j,d))continue;if(b===1&&!dayOK(i,d))continue;
      setC(k,b);setC(kj,a);
    }else if(r<0.80){ // 夜勤を別の人へ移す
      if(!canRem(i,d))continue;const j=rnd(n);if(j===i)continue;remN(i,d);if(!placeN(j,d)){revert();continue;}
    }else if(r<0.90){ // 同じ人の夜勤を別の日へ移す
      if(!canRem(i,d))continue;remN(i,d);if(!placeN(i,rnd(L))){revert();continue;}
    }else{ // 同じ人の日勤日を動かす
      const d2=rnd(L);if(d2===d||g[k]!==1||locked[k]||g[i*L+d2]!==0||!dayOK(i,d2))continue;setC(k,0);setC(i*L+d2,1);
    }
    ds.length=0;ns.length=0;
    for(let q=0;q<ch.length;q+=2){const kk=ch[q],ii=(kk/L)|0,dd=kk-ii*L;if(!ds.includes(dd))ds.push(dd);if(!ns.includes(ii))ns.push(ii);}
    let delta=0;nd.length=0;nn.length=0;
    for(const x of ds){const c=dayCost(M,g,x);nd.push(c);delta+=c-dayC[x];}
    for(const x of ns){const c=nurseCost(M,g,x);nn.push(c);delta+=c-nurC[x];}
    if(delta<=0||Math.random()<Math.exp(-delta/T)){
      ds.forEach((x,q)=>dayC[x]=nd[q]);ns.forEach((x,q)=>nurC[x]=nn[q]);total+=delta;
      if(total<best-1e-9){best=total;bestG.set(g);}
    }else revert();
  }
  return{g:bestG,cost:best};}

async function anneal(M,onProgress){
  const RUNS=2;let best=null;
  for(let r=0;r<RUNS;r++){const res=await annealOnce(M,onProgress,r/RUNS,(r+1)/RUNS);if(!best||res.cost<best.cost)best=res;}
  onProgress(1);return best;}

function assignLeaders(M,g){
  const cnt=new Array(M.n).fill(0),ncnt=new Array(M.n).fill(0),leaders={},nightLeaders={};
  const pick=(d,v,counts)=>{let bi=-1;for(let i=0;i<M.n;i++){if(!M.leader[i]||g[i*M.L+d]!==v)continue;
      if(bi<0||counts[i]<counts[bi]||(counts[i]===counts[bi]&&num(M.staff[i].exp)>num(M.staff[bi].exp)))bi=i;}return bi;};
  for(let d=0;d<M.L;d++){
    if(M.leadReq[d]){const i=pick(d,1,cnt);if(i>=0){leaders[d+1]=M.staff[i]._id;cnt[i]++;}}
    if(M.nightLeader&&M.reqN[0][d]>0){const i=pick(d,2,ncnt);if(i>=0){nightLeaders[d+1]=M.staff[i]._id;ncnt[i]++;}}}
  return{leaders,nightLeaders};}

// 作成前の見通し：夜勤の枠が足りるか
function precheck(M){
  const out=[];
  for(let r=0;r<2;r++){const need=M.reqN[r].reduce((a,b)=>a+b,0);if(!need)continue;
    let cap=0;M.staff.forEach((x,i)=>{if(M.role[i]!==r||!M.cnt[i])return;
      let fixed=0,avail=0;for(let d=0;d<M.L;d++){const k=i*M.L+d;if(M.fix[k]===2)fixed++;if(M.canN[k])avail++;}
      cap+=M.onlyFix[i]?fixed:Math.min(M.maxN[i],Math.max(fixed,Math.ceil(avail/(M.akeReq?3:2))));});
    if(cap<need)out.push(`${r?"ケアワーカー":"看護師"}の夜勤：必要な延べ人数は${need}回ですが、夜勤に入れる人の上限の合計は${cap}回です。夜勤の上限・人数・勤務タイプを見直さないと、不足が出ます。`);}
  // 日曜・祝日の休みを全員に確保できるか（勤務に入る人数＝日勤＋夜勤入り＋前日の夜勤の明け）
  if(M.holMin>0)for(let r=0;r<2;r++){const nr=M.role.filter(x=>x===r).length;if(!nr)continue;
    let cap=0,days=0;for(let d=0;d<M.L;d++){if(!M.holDay[d])continue;days++;cap+=Math.max(0,nr-M.reqD[r][d]-M.reqN[r][d]-(d>0?M.reqN[r][d-1]:M.reqN[r][d]));}
    const need=nr*M.holMin;
    if(cap<need)out.push(`${r?"ケアワーカー":"看護師"}の日曜・祝日の休み：この月の日曜・祝日は${days}日で、配置人数を満たすと休める延べ人数は最大${cap}日です。全員に${M.holMin}日ずつ（${need}日）は確保できないため、足りない人が出ます。`);}
  const leaders=M.staff.filter((x,i)=>M.leader[i]&&M.type[i]!=="nightOnly").length;
  if(M.leadReq.some(Boolean)&&!leaders)out.push("日勤リーダーができる看護師が登録されていません。");
  return out;}

/* ---------- 勤務表のチェック ---------- */
function analyze(wid,m,doc){
  const M=buildModel(wid,m,num(doc?.offDays,prof().offDays)),{n,L,staff,mi}=M,g=new Uint8Array(n*L),rows=doc?.rows||{};
  staff.forEach((x,i)=>{const r=rows[x._id]||"";for(let d=0;d<L;d++)g[i*L+d]=CODE[r[d]]??0;});
  const leaders=doc?.leaders||{},nl=doc?.nightLeaders||{},issues=[],dayStats=[],stats=[];
  const dl=d=>`${d+1}日(${WD[mi.days[d].wd]})`,sh=v=>v===1?"日勤":v===2?"夜勤":v===3?"明け":"休み";
  M.conflicts.forEach(t=>issues.push({lv:"bad",t}));
  for(let d=0;d<L;d++){const cD=[0,0],cN=[0,0];
    for(let i=0;i<n;i++){const v=g[i*L+d];if(v===1)cD[M.role[i]]+=M.cnt[i];if(v===2)cN[M.role[i]]+=M.cnt[i];}
    const li=M.idx.get(leaders[d+1]),lok=li!=null&&g[li*L+d]===1,ni=M.idx.get(nl[d+1]),nok=ni!=null&&g[ni*L+d]===2;
    dayStats.push({cD,cN,reqD:[M.reqD[0][d],M.reqD[1][d]],reqN:[M.reqN[0][d],M.reqN[1][d]],leader:lok?staff[li]:null,nightLeader:nok?staff[ni]:null,leadReq:M.leadReq[d]});
    for(let r=0;r<2;r++){const rn=r?"ケアワーカー":"看護師";
      if(cD[r]<M.reqD[r][d])issues.push({lv:"bad",t:`${dl(d)} 日勤の${rn}が${M.reqD[r][d]-cD[r]}名不足（${cD[r]}/${M.reqD[r][d]}名）`});
      if(cN[r]<M.reqN[r][d])issues.push({lv:"bad",t:`${dl(d)} 夜勤の${rn}が${M.reqN[r][d]-cN[r]}名不足（${cN[r]}/${M.reqN[r][d]}名）`});
      if(cN[r]>M.reqN[r][d])issues.push({lv:"warn",t:`${dl(d)} 夜勤の${rn}が設定より${cN[r]-M.reqN[r][d]}名多い`});}
    if(M.leadReq[d]&&!lok){const has=staff.some((x,i)=>M.leader[i]&&g[i*L+d]===1);
      issues.push({lv:"bad",t:has?`${dl(d)} 日勤リーダーが未指定（リーダー可の看護師は勤務しています）`:`${dl(d)} 日勤にリーダー可の看護師がいません`});}
    if(M.nightLeader&&M.reqN[0][d]>0&&!nok)issues.push({lv:"bad",t:`${dl(d)} 夜勤リーダーがいません`});
    if(M.precOn)for(const i of M.newList){const v=g[i*L+d];if(v!==1&&v!==2)continue;let ok;
      if(M.precMode==="assigned"&&M.prec[i]>=0)ok=g[M.prec[i]*L+d]===v;else ok=staff.some((x,j)=>M.qualP[j]&&g[j*L+d]===v);
      if(!ok)issues.push({lv:"bad",t:`${dl(d)} ${staff[i].name}（新人）の${sh(v)}に${M.precMode==="assigned"&&M.prec[i]>=0?"担当プリセプター":"経験"+M.p.preceptor.minExp+"年以上の看護師"}がいません`});}
    for(const[a,b]of M.ng){const va=g[a*L+d];if((va===1||va===2)&&va===g[b*L+d])issues.push({lv:"bad",t:`${dl(d)} ${staff[a].name}と${staff[b].name}が同じ${sh(va)}（同時勤務NG）`});}
  }
  staff.forEach((x,i)=>{let D=0,N=0,off=0,hit=0,run=M.carryRun[i],over=0,pairs=0,prevX=false,paired=false,hol=0,h1=0,h2=0,last=M.lastNight[i],gapHit=0;const hits=[];
    for(let d=0;d<L;d++){const k=i*L+d,v=g[k],pv=d===0?(M.prevAke[i]?3:0):g[k-1];
      if(v===0){off++;run=0;if(M.holDay[d])hol++;if(prevX&&!paired){pairs++;paired=true;}else paired=false;prevX=true;}
      else{run++;if(run===M.maxConsec+1)over++;prevX=false;paired=false;}
      if(v===1)D++;
      if(v===2){N++;if(d<M.half)h1++;else h2++;if(d-last<M.nightGap&&!M.onlyFix[i])gapHit++;last=d;}
      if(M.off[k]&&v!==0)issues.push({lv:"bad",t:`${x.name} ${dl(d)}は休み希望ですが${sh(v)}が入っています`});
      else if((v===1&&M.unD[k])||(v===2&&M.unN[k])||(v===3&&M.unD[k]&&M.akeReq===false))issues.push({lv:"bad",t:`${x.name} ${dl(d)}の${sh(v)}は「勤務不可」の希望です`});
      if(M.fix[k]&&v!==M.fix[k])issues.push({lv:"bad",t:`${x.name} ${dl(d)}は${M.fix[k]===1?"日勤":"夜勤"}指定${M.label[k]?"（"+M.label[k]+"）":""}ですが${sh(v)}になっています`});
      if(M.type[i]==="nightOnly"&&v===1&&!M.fix[k])issues.push({lv:"bad",t:`${x.name}（夜勤専従）${dl(d)}に日勤が入っています`});
      if(M.onlyFix[i]&&v===2&&M.fix[k]!==2)issues.push({lv:"bad",t:`${x.name} ${dl(d)}：指定日以外に夜勤が入っています`});
      if((v===1&&M.avD[k])||(v===2&&M.avN[k])){hit++;hits.push(`${d+1}日${sh(v)}`);}
      if(v===2&&d<L-1&&g[k+1]!==3)issues.push({lv:"bad",t:`${x.name} ${dl(d)}の夜勤の翌日が「明け」になっていません`});
      if(v===3&&pv!==2&&!(d===0&&M.locked[k]))issues.push({lv:"warn",t:`${x.name} ${dl(d)}の「明け」の前日が夜勤ではありません`});
      if(pv===3&&(v===1||v===2)&&M.p.akeOff!=="none")issues.push({lv:M.akeReq?"bad":"warn",t:`${x.name} ${dl(d)} 明けの翌日に${sh(v)}が入っています`});}
    if(N>M.maxN[i])issues.push({lv:"bad",t:`${x.name} 夜勤${N}回（上限${M.maxN[i]}回）`});
    if(over)issues.push({lv:"warn",t:`${x.name} 連続勤務が${M.maxConsec}日を超える箇所があります`});
    if(M.type[i]!=="nightOnly"&&off!==M.offTarget)issues.push({lv:"warn",t:`${x.name} 休み${off}日（公休数${M.offTarget}日）`});
    if(pairs<M.dblWant[i])issues.push({lv:"warn",t:`${x.name} 2連休が${pairs}回（目標${M.dblWant[i]}回）`});
    if(hol<M.holMin)issues.push({lv:"warn",t:`${x.name} 日曜・祝日の休みが${hol}日（目標${M.holMin}日以上）`});
    if(M.nightHalf&&!M.onlyFix[i]&&Math.abs(h1-h2)>1)issues.push({lv:"warn",t:`${x.name} 夜勤が月の${h1>h2?"前半":"後半"}に偏っています（前半${h1}回・後半${h2}回）`});
    if(gapHit)issues.push({lv:"info",t:`${x.name} 夜勤の間隔が${M.nightGap}日未満の箇所が${gapHit}か所`});
    if(hits.length)issues.push({lv:"info",t:`${x.name} 「できれば避けたい」と重なり: ${hits.join("、")}`});
    stats.push({D,N,off,hit,pairs,hol,h1,h2});});
  const order={bad:0,warn:1,info:2};issues.sort((a,b)=>order[a.lv]-order[b.lv]);
  return{M,g,dayStats,stats,issues};}

/* ---------- 描画 ---------- */
let pendingRender=false;
function editingNow(){const a=document.activeElement;return a&&$("#main").contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="checkbox"&&a.type!=="file";}
function renderSoft(){if(editingNow()){pendingRender=true;return;}render();}
$("#main").addEventListener("focusout",()=>{if(pendingRender)setTimeout(()=>{if(!editingNow()){pendingRender=false;render();}},0);});

function tabsFor(){const t=[["schedule","勤務表"]];if(S.isAdmin||prof().requestMode==="app")t.push(["requests","希望・指定"]);if(S.isAdmin)t.push(["staff","スタッフ","師長"],["wards","病棟プロファイル","師長"]);return t;}
function render(){
  const ws=S.wards;
  if(ws.length&&!wardDoc(S.wardId))S.wardId=ws[0]._id;
  const w=wardDoc(S.wardId);
  $("#wardTitle").textContent=w?`${w.name||"病棟"} 勤務表`:"病棟勤務表";
  $("#modeLine").textContent=S.mode==="loading"?"読み込み中…":S.mode==="local"?"このブラウザ内だけに保存しています":(S.isAdmin?"看護師長（管理者）として表示中":"スタッフとして表示中");
  const sel=$("#wardSel");sel.hidden=!ws.length;
  sel.innerHTML=ws.map(x=>`<option value="${esc(x._id)}" ${x._id===S.wardId?"selected":""}>${esc(x.name||"（名称未設定）")}</option>`).join("");
  $("#monthInput").value=S.month;
  const tabs=tabsFor();if(!tabs.some(t=>t[0]===S.tab))S.tab="schedule";
  $("#tabs").innerHTML=tabs.map(([k,l,r])=>`<button class="tab" role="tab" data-action="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}${r?`<span class="role">${r}</span>`:""}</button>`).join("");
  $("#banner").innerHTML=S.mode==="local"?`<div class="banner band"><div class="inner">この表示では病棟内でデータを共有できません。入力内容はこのブラウザの中だけに保存されます。claude.ai 上で開くと、スタッフ全員で同じデータを使えます。</div></div>`:"";
  if(S.mode==="loading")return;
  if(!ws.length&&S.tab!=="wards"){
    $("#main").innerHTML=`<div class="empty"><h2>病棟がまだ登録されていません</h2><p class="muted">${S.isAdmin?"最初に病棟プロファイルを登録してください。病棟ごとに、看護師・ケアワーカーの人数や配置のルールを持てます。":"看護師長が病棟を登録すると使えるようになります。"}</p>${S.isAdmin?`<button class="btn primary" data-action="tab" data-tab="wards">病棟を登録する</button>`:""}</div>`;
    renderSavebar();return;}
  if(S.tab==="schedule")renderSchedule();else if(S.tab==="requests")renderRequests();else if(S.tab==="staff")renderStaff();else renderWards();
  renderSavebar();}

function submission(wid,m){const ns=staffOf(wid),done=[],pending=[];
  ns.forEach(x=>{const r=requestFor(x._id,m);(r&&r.submitted?done:pending).push(x);});return{done,pending,total:ns.length};}
function fmtTime(t){const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}

function renderSchedule(){
  const wid=S.wardId,m=S.month,doc=schedOf(wid,m);let h="";
  if(S.isAdmin)h+=genPanel(wid,m,doc);
  if(!staffOf(wid).length){
    h+=`<div class="empty"><h2>${esc(wardName(wid))}のスタッフが登録されていません</h2><p class="muted">${S.isAdmin?"「スタッフ」タブで看護師・ケアワーカーを登録すると、ここで勤務表を作成できます。動きを試したい場合は、例のスタッフ27名を登録することもできます。":"看護師長がスタッフを登録すると、ここに勤務表が表示されます。"}</p>${S.isAdmin?`<div class="row"><button class="btn primary" data-action="tab" data-tab="staff">スタッフを登録する</button><button class="btn" data-action="seed">例のスタッフ27名を登録</button></div>`:""}</div>`;
  }else if(!doc){
    h+=`<div class="empty"><h2>${monthLabel(m)}の勤務表はまだありません</h2><p class="muted">${S.isAdmin?"希望と指定がそろったら、上の「勤務表を作成」を押してください。":"看護師長が作成して公開すると、ここに表示されます。今のうちに「希望・指定」タブから休み希望や会議の日を入力してください。"}</p></div>`;
  }else if(!S.isAdmin&&doc.status!=="published"){
    h+=`<div class="empty"><h2>${monthLabel(m)}の勤務表は作成中です</h2><p class="muted">看護師長が確認して公開すると表示されます。</p></div>`;
  }else{const A=analyze(wid,m,doc);h+=tableHtml(m,doc,A)+issuesHtml(A);}
  $("#main").innerHTML=h;if(S.gen)updateProgress();}

function genPanel(wid,m,doc){
  const sub=submission(wid,m),pct=sub.total?Math.round(sub.done.length/sub.total*100):0,p=prof();
  const status=!doc?`<span class="chip">未作成</span>`:doc.status==="published"?`<span class="chip ok">公開中</span>`:`<span class="chip warn">下書き（スタッフには非表示）</span>`;
  const off=S.offDraft[schedKey(wid,m)]??doc?.offDays??p.offDays;
  const pre=sub.total?precheck(buildModel(wid,m,num(off,9))):[];
  return `<section class="panel" aria-labelledby="genTitle">
   <div class="panel-head"><div class="stack"><h2 id="genTitle">${esc(wardName(wid))}　${monthLabel(m)}の勤務表</h2><div class="row">${status}${doc?.generatedAt?`<span class="hint">作成 ${fmtTime(doc.generatedAt)}${doc.edited?"・手直しあり":""}</span>`:""}</div></div>
    ${doc?`<div class="row"><button class="btn" data-action="publish">${doc.status==="published"?"非公開に戻す":"スタッフに公開する"}</button><button class="btn" data-action="print">印刷用に保存</button><button class="btn" data-action="csv">CSVで保存</button></div>`:""}</div>
   <div class="gen-grid">
    <div class="stack"><div class="row"><strong>希望の受付</strong><span>${sub.done.length} / ${sub.total}名</span><span class="hint">締切 ${monthLabel(addMonth(m,-1))}${p.deadlineDay}日</span></div>
     <div class="meter" aria-hidden="true"><span style="width:${pct}%"></span></div>
     ${sub.pending.length?`<details><summary class="hint">まだ受け付けていない${sub.pending.length}名を見る</summary><div class="chips" style="margin-top:6px">${sub.pending.map(x=>`<span class="chip">${esc(x.name)}</span>`).join("")}</div></details>`:sub.total?`<p class="hint">全員の希望がそろいました。</p>`:""}</div>
    <div class="gen-form">
     <label class="f" for="offDaysInput">この月の公休数<span class="row"><input id="offDaysInput" type="number" min="0" max="20" value="${esc(off)}"> 日</span></label>
     <button class="btn primary" data-action="generate" ${S.gen||!sub.total?"disabled":""}>勤務表を作成</button></div>
   </div>
   ${pre.length?`<div class="precheck"><strong>作成前の確認</strong><ul>${pre.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
   ${S.confirmGen?`<div class="confirm"><span>${monthLabel(m)}の勤務表はすでにあります${doc?.edited?"（手直しも含めて）":""}。作り直すと置き換わり、下書きに戻ります。</span><button class="btn primary small" data-action="generate-yes">置き換えて作成</button><button class="btn small" data-action="generate-no">やめる</button></div>`:""}
   <div id="genProgress" ${S.gen?"":"hidden"} class="stack"><div class="meter"><span id="genBar" style="width:0%"></span></div><p class="hint">夜勤の上限・明けの翌日の休み・指定日を守りながら、人数・リーダー・プリセプター・連休・希望を照らし合わせています…</p></div>
  </section>`;}
function updateProgress(){const b=$("#genBar");if(b)b.style.width=Math.round(S.genP*100)+"%";}

function tableHtml(m,doc,A){
  const{M,g,dayStats,stats}=A,{L,mi,staff}=M,p=M.p,leaders=doc.leaders||{},nl=doc.nightLeaders||{};
  const dcls=dy=>holidayOp(dy,p)||dy.hol?"sun":dy.wd===6?"sat":"";
  const STATS=8;
  let h=`<section class="panel"><div class="panel-head"><h2>${monthLabel(m)} 勤務一覧</h2>
   <div class="legend"><span><span class="c c-D">日</span>日勤</span><span><span class="c c-D">日<sup>L</sup></span>日勤リーダー</span><span><span class="c c-N">夜</span>夜勤入り</span><span><span class="c c-A">明</span>夜勤明け</span><span><span class="c c-X" style="border:1px solid var(--line)">休</span>休み</span><span>●指定日　右上：<b style="color:var(--bad)">◤</b>休み希望・不可 <b style="color:var(--warn)">◤</b>避けたい</span></div></div>
   ${S.isAdmin?`<p class="hint">マスを押すと勤務を手で直せます。変更はすぐに保存され、下の「確認が必要な点」もその場で更新されます。</p>`:""}
   <div class="scroll"><table class="roster"><thead><tr><th class="name-col">氏名</th>`;
  for(const dy of mi.days)h+=`<th class="day-h ${dcls(dy)}"><span class="dn">${dy.d}</span><span class="dw">${WD[dy.wd]}</span>${dy.hol?`<span class="hol">祝</span>`:""}</th>`;
  h+=`<th class="stat">日</th><th class="stat">夜</th><th class="stat" title="夜勤の前半／後半">前/後</th><th class="stat">休</th><th class="stat" title="2連休の回数">連休</th><th class="stat" title="日曜・祝日の休み">日祝</th><th class="stat" title="「できれば避けたい」と重なった回数">△</th><th class="stat" title="配置人数に数えるか">数</th></tr></thead><tbody>`;
  let careHeader=false;
  staff.forEach((x,i)=>{const s=stats[i];
    if(M.role[i]===1&&!careHeader){careHeader=true;h+=`<tr class="group"><th class="name-col" scope="rowgroup">ケアワーカー</th><td colspan="${L+STATS}"></td></tr>`;}
    const meta=[`経験${num(x.exp)}年`,M.leader[i]?"L":"",x.isNew?"新人":"",x.nightType&&x.nightType!=="normal"?TYPES[x.nightType]:"",x.excludeFromCount?"人数外":""].filter(Boolean).join("・");
    h+=`<tr><th class="name-col" scope="row"><span class="nm">${esc(x.name)}</span><span class="meta">${esc(meta)}</span></th>`;
    for(let d=0;d<L;d++){const k=i*L+d,v=g[k];
      const mk=(M.off[k]||M.unD[k]||M.unN[k])?"mk-x":(M.avD[k]||M.avN[k])?"mk-tri":"";
      const hit=(M.off[k]&&v)||((v===1)&&M.unD[k])||(v===2&&M.unN[k])||(M.fix[k]&&v!==M.fix[k])?"hit-x":((v===1&&M.avD[k])||(v===2&&M.avN[k]))?"hit-tri":"";
      const lab=LABEL[v]+((v===1&&leaders[d+1]===x._id)||(v===2&&nl[d+1]===x._id)?"<sup>L</sup>":"");
      const tip=[M.off[k]?"休み希望":"",M.fix[k]?`${M.fix[k]===1?"日勤":"夜勤"}指定${M.label[k]?"："+M.label[k]:""}`:"",M.unD[k]?"日勤不可":M.avD[k]?"日勤は避けたい":"",M.unN[k]?"夜勤不可":M.avN[k]?"夜勤は避けたい":""].filter(Boolean).join(" / ");

function applyReq(d,slot){
  const days=S.reqDraft.days,c={...(days[d]||{})},mode=S.reqMode;
  if(mode==="clear"){delete days[d];}
  else if(mode==="off"){if(c.off)delete days[d];else days[d]={off:1};}
  else if(mode==="fixD"||mode==="fixN"){const f=mode==="fixD"?"D":"N";
    if(c.fix===f)delete days[d];else{const o={fix:f};if(S.reqLabel.trim())o.label=S.reqLabel.trim();days[d]=o;}}
  else{const v=mode==="x"?2:1;delete c.off;delete c.fix;delete c.label;
    const slots=slot?[slot]:["D","N"],all=slots.every(s=>(c[s]||0)===v);
    slots.forEach(s=>{if(all)delete c[s];else c[s]=v;});
    if(c.D||c.N)days[d]=c;else delete days[d];}

const saveQ={};
function commitSched(key,doc){S.override[key]=doc;render();queueSched(key);}
async function queueSched(key){const q=saveQ[key]||(saveQ[key]={busy:false,again:false});if(q.busy){q.again=true;return;}q.busy=true;
  try{do{q.again=false;await Store.set("schedules/"+key,S.override[key]);}while(q.again);delete S.override[key];}
  catch(e){writeError(e);delete S.override[key];renderSoft();}
  q.busy=false;}

async function generate(){
  const wid=S.wardId,m=S.month,key=schedKey(wid,m);if(S.gen)return;
  const off=num(S.offDraft[key]??schedOf(wid,m)?.offDays??prof().offDays,9);
  const M=buildModel(wid,m,off);if(!M.n){toast("先にスタッフを登録してください。");return;}
  S.gen=true;S.genP=0;S.confirmGen=false;render();
  try{
    const res=await anneal(M,p=>{S.genP=p;updateProgress();});
    const{leaders,nightLeaders}=assignLeaders(M,res.g);
    const rows={};M.staff.forEach((x,i)=>{let s="";for(let d=0;d<M.L;d++)s+=CH[res.g[i*M.L+d]];rows[x._id]=s;});
    const was=schedOf(wid,m)?.status==="published";
    S.gen=false;
    commitSched(key,{wardId:wid,month:m,rows,leaders,nightLeaders,offDays:off,status:"draft",generatedAt:Date.now(),updatedAt:Date.now(),edited:false});
    toast(was?"作り直しました。公開を止めて下書きに戻しています。":"勤務表を作成しました。「確認が必要な点」を見て、必要ならマスを直してください。");
  }catch(e){S.gen=false;render();toast("作成中に問題が起きました。もう一度お試しください。");}}

  opts.push(["N","夜","夜勤入り（翌日を明けに）","c-N"]);
  if(prof().nightLeader&&x&&x.role!=="care"&&x.leader)opts.push(["NL","夜<sup>L</sup>","夜勤リーダー","c-N"]);
  opts.push(["A","明","明け","c-A"],["X","休","休み","c-X"]);

function applyCell(v){
  const{key,sid,d}=S.pop;closePop();const src=S.override[key]||S.schedules[key];if(!src)return;
  const doc=clone(src);delete doc._id;doc.leaders=doc.leaders||{};doc.nightLeaders=doc.nightLeaders||{};
  const L=monthInfo(doc.month).L,r=(doc.rows[sid]||"").padEnd(L,"X").slice(0,L).split(""),was=r[d],k=String(d+1),akeReq=prof().akeOff==="required";
  const code=v==="DL"?"D":v==="NL"?"N":v;r[d]=code;
  if(v==="DL")doc.leaders[k]=sid;else if(doc.leaders[k]===sid&&code!=="D")delete doc.leaders[k];
  if(v==="NL")doc.nightLeaders[k]=sid;else if(doc.nightLeaders[k]===sid&&code!=="N")delete doc.nightLeaders[k];
  if(code==="N"){if(d+1<L){r[d+1]="A";if(doc.leaders[String(d+2)]===sid)delete doc.leaders[String(d+2)];}
    if(akeReq&&d+2<L&&r[d+2]==="D"){r[d+2]="X";if(doc.leaders[String(d+3)]===sid)delete doc.leaders[String(d+3)];}}
  if(was==="N"&&code!=="N"&&d+1<L&&r[d+1]==="A")r[d+1]="X";
  doc.rows[sid]=r.join("");doc.edited=true;doc.updatedAt=Date.now();
  commitSched(key,doc);}

/* ---------- Googleフォームの回答の取り込み ---------- */
const FORM_COLS={off:"休み希望",unD:"日勤×",unN:"夜勤×",avD:"日勤△",avN:"夜勤△",fixD:"日勤指定",fixN:"夜勤指定"};
const norm=s=>String(s||"").normalize("NFKC").replace(/\s/g,"");
function monthKey(s){const mm=String(s||"").normalize("NFKC").match(/(\d{4})\D+(\d{1,2})/);return mm?`${mm[1]}-${pad(mm[2])}`:"";}
function parseTs(s){const t=Date.parse(String(s||"").replace(/-/g,"/"));return isNaN(t)?0:t;}
function decodeCsv(buf){const u8=new Uint8Array(buf);try{return new TextDecoder("utf-8",{fatal:true}).decode(u8).replace(/^﻿/,"");}catch(e){return new TextDecoder("shift_jis").decode(u8);}}
function parseCSV(t){const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===","){row.push(f);f="";}
    else if(c==="\n"){row.push(f);rows.push(row);row=[];f="";}else if(c!=="\r")f+=c;}
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x!==""));}
async function handleImportFile(file){
  if(!file)return;let text;
  try{text=decodeCsv(await file.arrayBuffer());}catch(e){toast("ファイルを読み込めませんでした。");return;}
  const rows=parseCSV(text);
  if(rows.length<2){toast("回答が見つかりません。フォームの回答シートのCSVか確かめてください。");return;}
  S.imp=buildImport(rows,S.month,file.name);render();}
function buildImport(rows,m,fileName){
  const head=rows[0].map(h=>String(h).trim()),L=monthInfo(m).L,col=f=>head.findIndex(f);
  const cTs=col(h=>/タイムスタンプ|timestamp/i.test(h)),cMonth=col(h=>h.includes("対象月")),cWard=col(h=>h.includes("病棟")&&!h.startsWith("氏名"));
  const cNames=head.map((h,i)=>h.startsWith("氏名")?i:-1).filter(i=>i>=0);
  const cDays=[];head.forEach((h,i)=>{const mm=h.normalize("NFKC").match(/\[\s*(\d{1,2})\s*日\s*\]/);if(mm)cDays.push([i,Number(mm[1])]);});
  const cReason=col(h=>h.includes("理由")),cNote=col(h=>h.includes("自由記載"));
  if(cMonth<0||!cNames.length||!cDays.length)return{fileName,m,rows:[],other:0,errors:["このCSVには「対象月」「氏名」「希望・指定」の列が見つかりません。フォーム作成プログラムで作ったフォームの回答シートか確かめてください。"]};
  let other=0;const out=[];
  rows.slice(1).forEach((r,ri)=>{
    if(monthKey(r[cMonth])!==m){other++;return;}
    const wardNm=cWard>=0?String(r[cWard]||"").trim():"",w=S.wards.find(x=>norm(x.name)===norm(wardNm));
    const csvName=cNames.map(i=>String(r[i]||"").trim()).find(Boolean)||"";
    const hit=(w?staffOf(w._id):S.staff).find(x=>norm(x.name)===norm(csvName));
    const warns=[];
    if(wardNm&&!w)warns.push(`病棟「${wardNm}」がアプリに登録されていません`);
    if(!hit)warns.push(`「${csvName||"（氏名なし）"}」が名簿に見つかりません。左の欄で選んでください`);
    const labels={},noteParts=[];
    String(cReason>=0?r[cReason]||"":"").split(/\r?\n|[、,]/).map(x=>x.trim()).filter(Boolean).forEach(x=>{
      const mm=x.normalize("NFKC").match(/^(\d{1,2})\s*日?\s*[:：]?\s*(.+)$/);if(mm)labels[Number(mm[1])]=mm[2].trim().slice(0,16);else noteParts.push(x);});
    const days={};let cOff=0,cUn=0,cAv=0,cFix=0;
    cDays.forEach(([ci,d])=>{const v=String(r[ci]||"").trim();if(!v)return;
      if(d>L){warns.push(`${d}日はこの月にないため無視します`);return;}
      const set=new Set(v.split(/[,;、]/).map(x=>x.trim()).filter(Boolean)),c={};
      if(set.has(FORM_COLS.off)){c.off=1;if(set.size>1)warns.push(`${d}日：休み希望と他の項目が両方付いています（休み希望を優先）`);}
      else{
        if(set.has(FORM_COLS.fixD)&&set.has(FORM_COLS.fixN))warns.push(`${d}日：日勤指定と夜勤指定が両方付いています（指定なしにします）`);
        else if(set.has(FORM_COLS.fixD))c.fix="D";else if(set.has(FORM_COLS.fixN))c.fix="N";
        if(set.has(FORM_COLS.unD))c.D=2;else if(set.has(FORM_COLS.avD))c.D=1;
        if(set.has(FORM_COLS.unN))c.N=2;else if(set.has(FORM_COLS.avN))c.N=1;
        if(c.fix==="D"&&c.D){warns.push(`${d}日：日勤指定と日勤の×/△が両方付いています（日勤指定を優先）`);delete c.D;}
        if(c.fix==="N"&&c.N){warns.push(`${d}日：夜勤指定と夜勤の×/△が両方付いています（夜勤指定を優先）`);delete c.N;}
        if(c.fix&&labels[d])c.label=labels[d];}
      if(Object.keys(c).length){days[d]=c;if(c.off)cOff++;if(c.D===2||c.N===2)cUn++;if(c.D===1||c.N===1)cAv++;if(c.fix)cFix++;}});
    Object.entries(days).forEach(([d,c])=>{if(c.fix==="N"&&(days[+d+1]?.off||days[+d+1]?.fix==="D"))warns.push(`${d}日の夜勤指定の翌日が休み希望・日勤指定です（明けと重なります）`);});
    Object.keys(labels).forEach(d=>{if(!days[d]?.fix)noteParts.push(`${d}日 ${labels[d]}`);});
    const note=[cNote>=0?String(r[cNote]||"").trim():"",noteParts.length?"（指定の理由欄より）"+noteParts.join("、"):""].filter(Boolean).join("\n").slice(0,600);
    out.push({ts:parseTs(cTs>=0?r[cTs]:""),wardName:wardNm,wid:w?._id||"",csvName,sid:hit?._id||"",days,note,warns,cOff,cUn,cAv,cFix,include:!!hit,old:false});});
  dedupeImport(out);
  return{fileName,m,rows:out,other,errors:[]};}
function dedupeImport(rows){const latest={};
  rows.forEach(r=>{if(r.sid&&(!latest[r.sid]||r.ts>=latest[r.sid].ts))latest[r.sid]=r;});
  rows.forEach(r=>{r.old=!!(r.sid&&latest[r.sid]!==r);if(r.old)r.include=false;});}
function namesScript(){return "const WARDS = {\n"+S.wards.map(w=>`  ${JSON.stringify(w.name||"病棟")}: [${staffOf(w._id).map(x=>JSON.stringify(x.name)).join(", ")}],`).join("\n")+"\n};";}
function importHtml(){
  const m=S.month,I=S.imp;
  let h=`<section class="panel"><div class="panel-head"><div class="stack"><h2>Googleフォームの回答を取り込む</h2>
    <p class="hint">回答のスプレッドシートを「ファイル → ダウンロード → カンマ区切り形式（.csv）」で保存し、下で選んでください。<strong>${monthLabel(m)}</strong>分の回答を、全病棟まとめて取り込みます（月は画面右上で切り替え）。</p></div>

  if(S.showNames)h+=`<div class="stack"><p class="hint">フォーム作成プログラムの冒頭にある <code>const WARDS = …</code> の部分を、下の内容に置き換えてください。名簿を変えたときは、置き換えた後に <code>updateChoices</code> を実行します。</p>
    <label class="sr" for="namesTxt">フォーム用の氏名リスト</label><textarea id="namesTxt" readonly rows="7" style="font-family:ui-monospace,monospace;font-size:.8rem">${esc(namesScript())}</textarea>
    <div class="row"><button class="btn small" data-action="names-copy">コピー</button></div></div>`;
  h+=`<label class="f" for="impFile">回答のCSVファイル<input type="file" id="impFile" accept=".csv,text/csv"></label>`;

function importPreview(I){
  if(I.errors.length)return `<div class="precheck">${I.errors.map(esc).join("<br>")}</div><div class="row"><button class="btn small" data-action="imp-cancel">閉じる</button></div>`;
  let h=`<div class="stack"><p><strong>${esc(I.fileName)}</strong>：${monthLabel(I.m)}分の回答 ${I.rows.length}件${I.other?`（ほかの月の回答 ${I.other}件は対象外）`:""}</p>`;
  if(I.m!==S.month)h+=`<p class="precheck">画面の月を切り替えたため、このファイルは${monthLabel(I.m)}分として読み込まれています。${monthLabel(S.month)}分を取り込むには、ファイルを選び直してください。</p>`;
  if(!I.rows.length)return h+`<p class="hint">この月の回答はありませんでした。画面右上の対象月を確かめてください。</p><div class="row"><button class="btn small" data-action="imp-cancel">閉じる</button></div></div>`;
  const n=I.rows.filter(r=>r.include&&r.sid).length;
  h+=`<div class="tbl-wrap"><table class="list"><thead><tr><th>取込</th><th>回答日時</th><th>病棟</th><th>フォームの氏名</th><th>名簿のスタッフ</th><th>休み希望</th><th>不可</th><th>避けたい</th><th>指定</th><th>確認事項</th></tr></thead><tbody>`;
  I.rows.forEach((r,i)=>{const pool=r.wid?staffOf(r.wid):S.staff,ex=r.sid&&requestFor(r.sid,I.m),warns=[...r.warns];
    if(r.old)warns.unshift("同じ人のもっと新しい回答があるため、こちらは取り込みません");

  h+=`</tbody></table></div><div class="row"><button class="btn primary" data-action="imp-commit" ${n&&!S.impBusy&&I.m===S.month?"":"disabled"}>${n}名分を取り込む</button><button class="btn" data-action="imp-cancel">やめる</button></div></div>`;

  switch(a){
    case"tab":S.tab=b.dataset.tab;try{history.replaceState(null,"","#"+S.tab);}catch(e){location.hash=S.tab;}render();window.scrollTo(0,0);break;
    case"month-prev":setMonth(addMonth(S.month,-1));break;
    case"month-next":setMonth(addMonth(S.month,1));break;
    case"generate":if(schedOf(S.wardId,S.month)){S.confirmGen=true;render();}else generate();break;
    case"generate-yes":generate();break;
    case"generate-no":S.confirmGen=false;render();break;
    case"publish":{const key=schedKey(S.wardId,S.month),d=clone(schedOf(S.wardId,S.month));delete d._id;const pub=d.status!=="published";d.status=pub?"published":"draft";commitSched(key,d);toast(pub?"スタッフに公開しました。":"非公開に戻しました。");break;}
    case"csv":exportCsv();break;
    case"print":exportPrint();break;
    case"imp-commit":commitImport();break;
    case"imp-cancel":S.imp=null;render();break;
    case"names-show":S.showNames=!S.showNames;render();break;
    case"names-copy":{const ta=$("#namesTxt");const done=()=>toast("コピーしました。フォーム作成プログラムの WARDS の部分に貼り付けてください。");
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ta.focus();ta.select();toast("選択しました。Ctrl＋C（Macは⌘＋C）でコピーしてください。");});
      else{ta.focus();ta.select();toast("選択しました。Ctrl＋C（Macは⌘＋C）でコピーしてください。");}break;}
    case"cell":if(S.pop&&S.pop.sid===b.dataset.sid&&S.pop.d===Number(b.dataset.d))closePop();else openPop(b);break;
    case"pop":applyCell(b.dataset.v);break;
    case"req-mode":S.reqMode=b.dataset.v;document.querySelectorAll('[data-action="req-mode"]').forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===S.reqMode)));$("#reqModeHelp").innerHTML=modeHelp();break;
    case"req-day":applyReq(b.dataset.d,null);refreshCal();break;
    case"req-slot":applyReq(b.dataset.d,["x","tri"].includes(S.reqMode)?b.dataset.s:null);refreshCal();break;
    case"req-save":saveRequest(b.dataset.submit==="1");break;
    case"staff-new":S.staffEdit={role:"nurse",nightType:"normal",tenure:0,exp:0,weekly:{}};S.staffDel=null;render();$("#fName")?.focus();break;
    case"staff-edit":S.staffEdit=clone(staffById(id));S.staffDel=null;render();$("#staffEditor").scrollIntoView({block:"nearest"});$("#fName")?.focus();break;
    case"staff-cancel":S.staffEdit=null;S.staffDel=null;render();break;
    case"staff-del":S.staffDel=S.staffEdit._id;render();break;
    case"staff-del-no":S.staffDel=null;render();break;
    case"staff-del-yes":{const sid=S.staffEdit._id,name=S.staffEdit.name;Store.del("staff/"+sid).then(()=>{S.staffEdit=null;S.staffDel=null;toast(`${name}さんを削除しました。`);render();}).catch(writeError);break;}
    case"staff-up":moveStaff(id,-1);break;
    case"staff-down":moveStaff(id,1);break;
    case"staff-resort":resortStaff();break;
    case"seed":seed();break;
    case"unseed":S.staffDel="__sample";render();break;
    case"unseed-no":S.staffDel=null;render();break;
    case"unseed-yes":unseed();break;
    case"ward-add":{const nm=$("#wNew").value.trim();if(!nm){toast("病棟名を入力してください。");$("#wNew").focus();break;}addWard(nm,null);break;}
    case"ward-copy":{const src=wardDoc(id);addWard((src?.name||"病棟")+"（複製）",id);break;}
    case"ward-select":setWard(id);break;
    case"ward-up":moveWard(id,-1);break;
    case"ward-down":moveWard(id,1);break;
    case"ward-rename":S.wardRename=id;render();$("#wRename")?.focus();break;
    case"ward-rename-no":S.wardRename=null;render();break;
    case"ward-rename-save":{const w=wardDoc(S.wardRename),nm=$("#wRename").value.trim();if(!w||!nm)break;Store.set("wards/"+w._id,{...w,name:nm}).then(()=>{S.wardRename=null;render();}).catch(writeError);break;}
    case"ward-del":S.wardDel=id;render();break;
    case"ward-del-no":S.wardDel=null;render();break;
    case"ward-del-yes":deleteWard(S.wardDel);break;
    case"ng-add":{const A=$("#ngA").value,B=$("#ngB").value,ng=S.rulesDraft.data.ngPairs;if(!A||!B||A===B){toast("違う二人を選んでください。");break;}
      if(ng.some(p=>(p.a===A&&p.b===B)||(p.a===B&&p.b===A))){toast("その組み合わせは登録済みです。");break;}
      ng.push({a:A,b:B});S.rulesDirty=true;S.ngA="";S.ngB="";render();break;}
    case"ng-del":S.rulesDraft.data.ngPairs.splice(Number(b.dataset.i),1);S.rulesDirty=true;render();break;
    case"rules-reset":S.rulesDirty=false;S.rulesDraft=null;render();break;
    case"rules-save":{const wid=S.rulesDraft.wid,w=wardDoc(wid);if(!w)break;const d={...clone(S.rulesDraft.data),name:w.name,order:w.order};
      Store.set("wards/"+wid,d).then(()=>{S.rulesDirty=false;toast("病棟プロファイルを保存しました。");render();}).catch(writeError);break;}
  }});
function refreshCal(){const el=$("#reqCal");if(el)el.innerHTML=calHtml(S.month,staffById(S.reqDraft.sid));const st=$("#reqStatus");if(st)st.textContent=reqStatus(requestFor(S.reqDraft.sid,S.month));}
function saveLocalPref(){try{localStorage.setItem(LKEY+"-pref",JSON.stringify({month:S.month,wardId:S.wardId}));}catch(e){}}
function setMonth(m){if(!/^\d{4}-\d{2}$/.test(m))return;S.month=m;S.confirmGen=false;closePop();saveLocalPref();render();}
function setWard(id){if(S.rulesDirty&&S.rulesDraft?.wid!==id){S.rulesDirty=false;S.rulesDraft=null;toast("保存していないルールの変更を取り消しました。");}
  S.wardId=id;S.reqSel=null;S.reqDraft=null;S.staffEdit=null;S.confirmGen=false;closePop();saveLocalPref();render();}

document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset.bind&&S.rulesDraft){const v=t.type==="checkbox"?t.checked:t.type==="number"?num(t.value,0):t.value;setPath(S.rulesDraft.data,t.dataset.bind,v);if(!S.rulesDirty){S.rulesDirty=true;renderSavebar();}}
  else if(t.id==="offDaysInput")S.offDraft[schedKey(S.wardId,S.month)]=t.value;
  else if(t.id==="reqNote"&&S.reqDraft){S.reqDraft.note=t.value;S.reqDraft.dirty=true;}
  else if(t.id==="reqLabel")S.reqLabel=t.value;
  else if(t.id==="fExp"&&!S.staffEdit?._id&&num(t.value,0)<1&&$("#fNew"))$("#fNew").checked=true;});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="monthInput")setMonth(t.value);
  else if(t.id==="wardSel")setWard(t.value);
  else if(t.id==="impFile")handleImportFile(t.files&&t.files[0]);
  else if(t.dataset.imp!=null&&S.imp){S.imp.rows[Number(t.dataset.imp)].include=t.checked;render();}
  else if(t.dataset.impsid!=null&&S.imp){const r=S.imp.rows[Number(t.dataset.impsid)];r.sid=t.value;dedupeImport(S.imp.rows);r.include=!!r.sid&&!r.old;render();}
  else if(t.id==="reqStaff"){S.reqSel=t.value||null;S.reqDraft=null;render();}
  else if(t.id==="ngA")S.ngA=t.value;else if(t.id==="ngB")S.ngB=t.value;
  else if(t.id==="fRole"){const care=t.value==="care";["fLeaderWrap","fNewWrap","fPrecWrap"].forEach(i=>{const el=document.getElementById(i);if(el)el.hidden=care;});}});
document.addEventListener("submit",ev=>{if(ev.target.id==="staffForm"){ev.preventDefault();saveStaff();}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closePop();});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(tabsFor().some(t=>t[0]===h)){S.tab=h;render();}});
window.addEventListener("beforeunload",ev=>{if(S.reqDraft?.dirty||S.rulesDirty){ev.preventDefault();ev.returnValue="";}});

let toastT=0;
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),4000);}

/* ---------- 起動 ---------- */
async function boot(){
  try{const p=JSON.parse(localStorage.getItem(LKEY+"-pref")||"{}");if(p.month&&/^\d{4}-\d{2}$/.test(p.month))S.month=p.month;if(p.wardId)S.wardId=p.wardId;}catch(e){}
  const h=location.hash.slice(1);if(["schedule","requests","staff","wards"].includes(h))S.tab=h;
  render();
  let db=null,user=null;const c=window.claude;
  if(c&&typeof c.use==="function"){try{[db,user]=await Promise.all([c.use("db"),c.use("user")]);}catch(e){}}
  if(db){Store.db=db;S.mode="shared";}else{Store.initLocal();S.mode="local";}
  if(user){try{S.isAdmin=await user.canEdit();S.uid=await user.id();}catch(e){}}else S.isAdmin=true;
  Store.sub("wards",docs=>{S.wards=docs.sort((a,b)=>num(a.order)-num(b.order));renderSoft();});
  Store.sub("staff",docs=>{S.staff=docs;renderSoft();});
  Store.sub("schedules",docs=>{S.schedules=Object.fromEntries(docs.map(d=>[d._id,d]));renderSoft();});
  Store.sub("requests",docs=>{S.requests=Object.fromEntries(docs.map(d=>[d._id,d]));
    if(!S.isAdmin&&S.uid&&S.requests[S.uid]?.wardId&&!S.wardPicked){S.wardPicked=true;if(wardDoc(S.requests[S.uid].wardId))S.wardId=S.requests[S.uid].wardId;}
    renderSoft();});
  render();}
boot();
})();
</script>
